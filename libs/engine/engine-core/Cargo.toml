[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi_binding"]
napi_binding = ["napi", "napi-derive"]

[dependencies]
shared-types = { path = "../shared-types" }
napi = { version = "2", features = ["napi8", "serde-json"], optional = true }
napi-derive = { version = "2", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = "6"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rhai = { version = "1", features = ["sync", "no_function", "no_module"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "condition_bench"
harness = false
